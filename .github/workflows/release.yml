name: release

# T-6.4 (RNF-016): builds the signed(-ready) NSIS/MSI installer and publishes a
# draft GitHub Release. Runs only on Windows — NSIS/MSI can only be produced
# on Windows (see `src-tauri/RELEASE.md`).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Setup Node.js for frontend (TypeScript, React, Vite) — same as ci.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Setup Rust toolchain for src-tauri workspace — same as ci.yml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Cache Rust compilation artifacts in src-tauri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run build

      # Same quality gate as ci.yml before shipping an installer.
      - run: cargo test --workspace --manifest-path src-tauri/Cargo.toml

      # T-6.3 audit MINOR #12 (VULN-002 release-gate): a tagged release must ship a
      # signed installer — refuse to publish an unsigned `.exe`/`.msi` from a `v*` tag
      # by accident. Only tag pushes are gated (manual workflow_dispatch runs, used for
      # local/dev-cert testing, are exempt); an unsigned tagged release still goes out
      # if a repo variable ALLOW_UNSIGNED is explicitly set to "true" (documented
      # break-glass for an emergency release before the signing certificate lands).
      - name: Verify installer will be signed (VULN-002 release gate)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ALLOW_UNSIGNED: ${{ vars.ALLOW_UNSIGNED }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          with open("src-tauri/tauri.conf.json", encoding="utf-8") as f:
              conf = json.load(f)

          windows_bundle = conf.get("bundle", {}).get("windows", {}) or {}
          thumbprint = windows_bundle.get("certificateThumbprint")
          sign_command = windows_bundle.get("signCommand")

          if thumbprint or sign_command:
              print("Signing is configured (certificateThumbprint or signCommand set).")
              sys.exit(0)

          if os.environ.get("ALLOW_UNSIGNED", "").lower() == "true":
              print("::warning::Publishing an UNSIGNED installer for a tagged release "
                    "(ALLOW_UNSIGNED=true break-glass override).")
              sys.exit(0)

          print(
              "::error::Tagged release with no code-signing configured "
              "(bundle.windows.certificateThumbprint and signCommand are both null/unset "
              "in src-tauri/tauri.conf.json). See src-tauri/RELEASE.md §2. "
              "Set the repo variable ALLOW_UNSIGNED=true to override for an emergency "
              "unsigned release."
          )
          sys.exit(1)
          PY

      # --- Code signing (T-6.5 / out of code scope for T-6.4) ---------------
      # The certificate is provided by the team, not committed to this repo.
      # Once available, wire ONE of the two mechanisms below and re-enable it:
      #
      # Option A — certificate installed in the Windows cert store (thumbprint):
      #   1. Import the .pfx into the runner's cert store (e.g. via a prior
      #      step using `Import-PfxCertificate`, fed from a base64 secret).
      #   2. Set `bundle.windows.certificateThumbprint` in `tauri.conf.json`
      #      (or override via `TAURI_BUNDLE_WINDOWS_CERTIFICATE_THUMBPRINT`
      #      if supported by the installed tauri-cli version) to the cert's
      #      SHA-1 thumbprint. `signtool.exe` (already on windows-latest) is
      #      used automatically by the Tauri bundler.
      #
      # Option B — custom sign command (HSM / cloud signing service):
      #   Set `bundle.windows.signCommand` in `tauri.conf.json` to invoke the
      #   provider's CLI, e.g.:
      #     "signCommand": "azuresigntool sign -kvu %AZURE_KEY_VAULT_URI% ... %1"
      #   and pass the provider's credentials as step `env:` here.
      #
      # Either way, `bundle.windows.timestampUrl` is already set to DigiCert's
      # RFC 3161 endpoint in `tauri.conf.json` so signatures remain valid after
      # the certificate expires.
      #
      # - name: Import code-signing certificate
      #   env:
      #     WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      #     WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      #   run: |
      #     echo "$WINDOWS_CERTIFICATE" | base64 --decode > certificate.pfx
      #     powershell -Command "Import-PfxCertificate -FilePath certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String '$env:WINDOWS_CERTIFICATE_PASSWORD' -AsPlainText -Force)"

      # `bundle.createUpdaterArtifacts` is `false` (T-6.5, optional) — no
      # `TAURI_SIGNING_PRIVATE_KEY` / `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`
      # needed yet. When the updater plugin lands, set both as repo secrets
      # and export them here before `tauri build`.
      - name: Build NSIS/MSI installers
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: osystems-sync-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
