[package]
name = "osystems-sync-core"
version = "0.2.0"
edition = "2021"

[lib]
name = "osystems_sync_core"

[features]
# Exposes `credentials::MemoryStore` (an in-memory, OS-unprotected `SecretStore`) to a
# dependent crate's own tests, without it ever reaching a normal (non-test) build —
# MINOR #7 / T-6.3 audit. `osystems-sync`'s dev-dependency below enables it; the ordinary
# `[dependencies]` entry in that same Cargo.toml does not, and Cargo's resolver "2" keeps
# the two separate.
test-support = []

[dependencies]
yup-oauth2 = { version = "11", default-features = false, features = ["hyper-rustls", "ring", "service-account"] }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "http-1x"] }
aws-smithy-types = "1"
aws-smithy-http-client = { version = "1", default-features = false, features = ["default-client", "rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1"
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
notify = "6"
notify-debouncer-full = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ts-rs = { version = "9", features = ["serde-compat", "no-serde-warnings"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Power"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
